name: Build Dopamine IPA

# 仓库里只放补丁 + 预装 deb + 本工作流；构建时实时拉取上游 3.x，打补丁后编译出 Dopamine.ipa。
on:
  workflow_dispatch:
    inputs:
      mode:
        description: '构建模式（app-only 约 6 分钟 / full 约 30 分钟）'
        required: true
        default: app-only
        type: choice
        options:
          - app-only
          - full
      upstream_ref:
        description: '上游分支或 commit'
        required: true
        default: 3.x

permissions:
  contents: read

env:
  UPSTREAM_IPA: https://github.com/opa334/Dopamine/releases/download/3.0.13/Dopamine.ipa

jobs:
  build:
    name: Build IPA
    runs-on: macos-15
    timeout-minutes: 120

    steps:
      - name: Checkout 构建仓库
        uses: actions/checkout@v4

      - name: 拉取上游源码 + 子模块，打补丁
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "${{ inputs.upstream_ref }}" https://github.com/opa334/Dopamine.git upstream
          cd upstream
          echo "上游 commit: $(git rev-parse HEAD)"
          git submodule update --init --recursive --depth 1
          git apply -v "$GITHUB_WORKSPACE/patches/dopamine-3.x-custom.patch"
          cp "$GITHUB_WORKSPACE"/debs/*.deb Application/Dopamine/Resources/
          ls -lh Application/Dopamine/Resources/*.deb

      - name: 准备 BaseBin 头文件与预置库
        run: |
          set -euo pipefail
          make -C upstream/BaseBin .build .include
          ls upstream/BaseBin/.include

      - name: 安装 ldid
        run: |
          set -euo pipefail
          command -v ldid >/dev/null 2>&1 || brew install ldid || true
          ldid -h >/dev/null 2>&1 && echo "ldid OK" || echo "::warning::ldid 不可用"

      - name: 取上游 basebin.tar / 内置 deb
        if: inputs.mode == 'app-only'
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o upstream.ipa "$UPSTREAM_IPA"
          unzip -q upstream.ipa -d up
          APP=up/Payload/Dopamine.app
          test -f "$APP/basebin.tar" || { echo "上游 IPA 缺少 basebin.tar，请改用 mode=full"; exit 1; }
          cp "$APP/basebin.tar" "$APP/basebin.tc" upstream/BaseBin/
          tar xf upstream/BaseBin/basebin.tar -C upstream/BaseBin/.build --strip-components=1
          ls -lh upstream/BaseBin/.build/libjailbreak.dylib upstream/BaseBin/.build/*.dylib | head
          mkdir -p upstream/Packages/libkrw-provider upstream/Packages/basebin-link upstream/Packages/libroot
          for d in "$APP"/*.deb; do
            n="$(basename "$d")"
            case "$n" in
              libkrw*)       cp "$d" upstream/Packages/libkrw-provider/ ;;
              basebin-link*) cp "$d" upstream/Packages/basebin-link/ ;;
              libroot*)      cp "$d" upstream/Packages/libroot/ ;;
            esac
          done
          ls -lh upstream/BaseBin/basebin.tar upstream/Packages/*/*.deb

      - name: 编译 BaseBin + Packages（full）
        if: inputs.mode == 'full'
        run: |
          set -euo pipefail
          export THEOS="$HOME/theos"
          [ -d "$THEOS" ] || git clone --recursive --depth 1 https://github.com/theos/theos.git "$THEOS"
          export PATH="$THEOS/bin:$PATH"
          [ -x "$THEOS/bin/ldid" ] || { for f in "$THEOS"/bin/ldid_macosx_*; do [ -x "$f" ] && cp "$f" "$THEOS/bin/ldid" && break; done; }
          ncpu="$(sysctl -n hw.ncpu)"
          make -C upstream/BaseBin  -j"$ncpu" 2>&1 | tail -60
          make -C upstream/Packages -j"$ncpu" 2>&1 | tail -20

      - name: 编译 App 并打包 IPA
        run: |
          set -euo pipefail
          make -C upstream/Application 2>&1 | tail -200
          ls -lh upstream/Application/Dopamine.ipa

      - name: 校验产物
        run: |
          set -euo pipefail
          IPA=upstream/Application/Dopamine.ipa
          test -f "$IPA"
          for d in ellekit preferenceloader altlist libsandy choicy trollstorelite basebin.tar; do
            unzip -l "$IPA" | grep -q "$d" || { echo "缺少 $d"; exit 1; }
          done
          unzip -l "$IPA" | grep -E "\.deb|basebin" | head -20
          echo "校验通过"

      - name: 上传 IPA
        uses: actions/upload-artifact@v4
        with:
          name: Dopamine-custom-ipa
          path: upstream/Application/Dopamine.ipa
          if-no-files-found: error
          retention-days: 30
